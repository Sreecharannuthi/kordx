# KordX CI - validation only. This workflow never publishes releases.
#
# Pull requests and pushes to main run debug builds, JVM tests, and static analysis.
# Signed release APKs are built and published only by the manually triggered
# .github/workflows/release.yml workflow.
# Metaphony instrumentation tests are intentionally not run in CI because they
# require an Android Virtual Device/emulator. They are run manually by the
# maintainer; see CONTRIBUTING.md "Reporting issues" for details.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, JVM tests, and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Resolve Android SDK versions
        id: sdk
        shell: bash
        run: |
          COMPILE_SDK="$(sed -nE 's/^[[:space:]]*compile-sdk = "([0-9]+)"/\1/p' gradle/libs.versions.toml | head -n 1)"
          if [[ ! "$COMPILE_SDK" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve compile SDK from gradle/libs.versions.toml"
            exit 1
          fi
          echo "compile_sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-${{ steps.sdk.outputs.compile_sdk }}" "build-tools;${{ steps.sdk.outputs.compile_sdk }}.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Build (debug, all modules)
        run: ./gradlew :app:assembleDebug :core:assembleDebug :infra:assembleDebug :metaphony:assembleDebug --no-daemon --stacktrace

      - name: Compile app instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest :infra:testDebugUnitTest :metaphony:testDebugUnitTest --no-daemon --stacktrace

      - name: Static analysis
        run: ./gradlew :app:lintDebug :app:lintRelease detekt --no-daemon --stacktrace
