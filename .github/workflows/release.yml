# KordX release workflow - explicit release publishing only.
#
# This workflow is intentionally independent from CI. It has no push or
# pull_request trigger, so normal code pushes can never publish a release.
# Start it manually from the Actions tab after CI has passed for the intended
# commit. The manual run builds and publishes the signed release APKs.

name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type release to build and publish the release"
        required: true
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build and publish signed release APKs
    if: inputs.confirm == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Resolve Android SDK versions
        id: sdk
        shell: bash
        run: |
          COMPILE_SDK="$(sed -nE 's/^[[:space:]]*compile-sdk = "([0-9]+)"/\1/p' gradle/libs.versions.toml | head -n 1)"
          if [[ ! "$COMPILE_SDK" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve compile SDK from gradle/libs.versions.toml"
            exit 1
          fi
          echo "compile_sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-${{ steps.sdk.outputs.compile_sdk }}" "build-tools;${{ steps.sdk.outputs.compile_sdk }}.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          cache-read-only: false

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing release versionName: $VERSION"
            exit 1
          fi
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} already exists"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/kordx-release.jks

      - name: Write keystore properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/kordx-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures and expected outputs
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.compile_sdk }}.0.0/apksigner"
          EXPECTED_APKS=(
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
          )
          for apk in "${EXPECTED_APKS[@]}"; do
            test -f "$apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { header_seen = 0 }
            /^## \[/ {
              if (header_seen) exit
              if (index($0, "[" ver "]") > 0) { header_seen = 1 }
            }
            header_seen { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KordX ${{ steps.release.outputs.tag }}
          draft: false
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
          fail_on_unmatched_files: true

      - name: Cleanup keystore and properties
        if: always()
        run: |
          rm -f keystore/kordx-release.jks
          rm -f app/keystore.properties
